name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install AI workflow dependencies
        working-directory: ai-workflow
        run: npm install

      - name: Run AI code review
        working-directory: ai-workflow
        env:
          GITHUB_TOKEN: ${{ secrets.AI_ORCHESTRATOR_TOKEN }}
          REPO_ROOT: ${{ github.workspace }}
          AI_BASE_BRANCH: "AI_ORCHESTRATOR"
          AI_CONFIG_JSON: ${{ secrets.AI_CONFIG_JSON }}
          AI_CONFIG_PATH: ${{ vars.AI_CONFIG_PATH }}
          AI_PROVIDER_KEYS_JSON: ${{ secrets.AI_PROVIDER_KEYS_JSON }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: npx tsx scripts/code-review.ts
