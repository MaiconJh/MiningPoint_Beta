name: AI Feature Proposal

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: ai-feature-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  propose:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'ai:propose')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: AI_ORCHESTRATOR
          token: ${{ secrets.AI_ORCHESTRATOR_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run feature proposal
        env:
          GITHUB_TOKEN: ${{ secrets.AI_ORCHESTRATOR_TOKEN }}
          AI_BASE_BRANCH: "AI_ORCHESTRATOR"
          AI_CONFIG_JSON: ${{ secrets.AI_CONFIG_JSON }}
          AI_CONFIG_PATH: ${{ vars.AI_CONFIG_PATH }}
          AI_PROVIDER_KEYS_JSON: ${{ secrets.AI_PROVIDER_KEYS_JSON }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          AI_DRY_RUN: "false"
        run: npx tsx scripts/feature-proposal.ts

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = ${{ github.event.issue.number || github.event.inputs.issue_number }};
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: 'AI Feature Proposal falhou. Verifique os logs em https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}.',
            });
